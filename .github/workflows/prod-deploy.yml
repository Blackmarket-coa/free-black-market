name: Deploy → Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. v1.2.3 or sha-abcd123). Required.'
        required: true
      allow_legal_placeholders:
        description: 'EMERGENCY ONLY: deploy even though the legal pages still have unfilled [[PLACEHOLDERS]] (recorded in the run summary).'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  deploy:
    name: Apply Kubernetes manifests (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://freeblackmarket.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Legal release gate, before anything touches the cluster. The Terms,
      # Privacy and Refunds pages ship `[[TOKENS]]` for operator facts (legal
      # entity, governing law, contact inboxes) and a "not yet legally
      # reviewed" banner; scripts/check-legal-placeholders.mjs exits 1 while
      # any of that remains. Deliberately not in PR CI: an unfilled token is
      # the correct state during development (see the script's header).
      #
      # It reads storefront/src/lib/constants/legal.ts at the ref this run was
      # dispatched from, not from inside the image, so dispatch it from the ref
      # `image_tag` was built from.
      #
      # `allow_legal_placeholders` is the emergency override (a security fix
      # or rollback while counsel's review is still open): the check still
      # runs and prints what is unfilled, the deploy proceeds, and the override
      # is written to the run summary with who triggered it.
      - name: Legal pages release gate
        env:
          ALLOW_LEGAL_PLACEHOLDERS: ${{ inputs.allow_legal_placeholders }}
          ACTOR: ${{ github.actor }}
        run: |
          if node scripts/check-legal-placeholders.mjs; then
            exit 0
          fi
          if [ "$ALLOW_LEGAL_PLACEHOLDERS" = "true" ]; then
            echo "::warning::Legal pages have unfilled placeholders; deploying anyway because allow_legal_placeholders is set."
            echo "**Legal release gate overridden** by @${ACTOR}: the legal pages still carry unfilled placeholders." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Legal pages are not ready to publish (listed above). Fill storefront/src/lib/constants/legal.ts, or re-run with allow_legal_placeholders for an emergency deploy."
          exit 1

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.PRODUCTION_KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::PRODUCTION_KUBE_CONFIG_DATA secret is not configured."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify image is signed and present
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          for image in free-black-market-backend free-black-market-storefront free-black-market-admin-panel free-black-market-vendor-panel; do
            ref="ghcr.io/${{ github.repository_owner }}/$image:$IMAGE_TAG"
            echo "Verifying $ref"
            docker buildx imagetools inspect "$ref" >/dev/null
          done

      - name: Render manifests
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          if [ ! -d infrastructure/k8s/production ]; then
            echo "::warning::infrastructure/k8s/production is empty; skipping kubectl apply."
            exit 0
          fi
          find infrastructure/k8s/production -type f -name '*.yaml' -print0 \
            | xargs -0 sed -i "s|__IMAGE_REGISTRY__|$IMAGE_REGISTRY|g; s|__IMAGE_TAG__|$IMAGE_TAG|g"

      - name: Apply manifests
        if: hashFiles('infrastructure/k8s/production/*.yaml') != ''
        run: kubectl apply -f infrastructure/k8s/production/

      - name: Wait for rollouts
        if: hashFiles('infrastructure/k8s/production/*.yaml') != ''
        run: |
          for d in backend storefront admin-panel vendor-panel; do
            kubectl -n freeblackmarket-production rollout status deployment/$d --timeout=15m || exit 1
          done

      - name: Smoke test
        run: |
          for url in \
            "https://freeblackmarket.com/api/health" \
            "https://admin.freeblackmarket.com/healthz" \
            "https://vendor.freeblackmarket.com/healthz"; do
            echo "Checking $url"
            curl -fsS --max-time 10 "$url" >/dev/null
          done

      - name: Annotate deployment
        run: |
          echo "## Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: \`${{ inputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by: @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
