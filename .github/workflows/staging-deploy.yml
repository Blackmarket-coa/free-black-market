name: Deploy → Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-abcd123 or v1.2.3-rc.1). Defaults to latest commit on the triggering ref.'
        required: false
        default: ''

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  deploy:
    name: Apply Kubernetes manifests (staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.freeblackmarket.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(git rev-parse --short=7 ${{ github.sha }})"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.STAGING_KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::STAGING_KUBE_CONFIG_DATA secret is not configured."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Render manifests
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          # Replace the image-tag token in each manifest. Manifests live under
          # infrastructure/k8s/staging/* once authored; this workflow tolerates
          # an empty directory and exits with a clear message.
          if [ ! -d infrastructure/k8s/staging ]; then
            echo "::warning::infrastructure/k8s/staging is empty; skipping kubectl apply."
            exit 0
          fi
          find infrastructure/k8s/staging -type f -name '*.yaml' -print0 \
            | xargs -0 sed -i "s|__IMAGE_REGISTRY__|$IMAGE_REGISTRY|g; s|__IMAGE_TAG__|$IMAGE_TAG|g"

      - name: Apply manifests
        if: hashFiles('infrastructure/k8s/staging/*.yaml') != ''
        run: kubectl apply -f infrastructure/k8s/staging/

      - name: Wait for rollouts
        if: hashFiles('infrastructure/k8s/staging/*.yaml') != ''
        run: |
          for d in backend storefront admin-panel vendor-panel; do
            kubectl -n freeblackmarket-staging rollout status deployment/$d --timeout=10m || exit 1
          done

      - name: Smoke test
        run: |
          for url in \
            "https://staging.freeblackmarket.com/api/health" \
            "https://staging-admin.freeblackmarket.com/healthz" \
            "https://staging-vendor.freeblackmarket.com/healthz"; do
            echo "Checking $url"
            curl -fsS --max-time 10 "$url" >/dev/null
          done
