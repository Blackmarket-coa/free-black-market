name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  schedule:
    - cron: '0 5 * * 1'

# Cancel in-progress runs for the same ref when a new commit lands. Keeps CI
# minutes bounded now that integration tests run on every PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            storefront/pnpm-lock.yaml
            admin-panel/pnpm-lock.yaml
            vendor-panel/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install storefront dependencies
        working-directory: storefront
        run: pnpm install --frozen-lockfile

      - name: Check vendor/module completeness
        run: pnpm check:vendor-completeness

      - name: Check logging hygiene (no bare console.* in runtime code)
        run: pnpm check:no-console

      - name: Lint storefront
        working-directory: storefront
        run: pnpm lint

      - name: Validate storefront internal links against routes
        working-directory: storefront
        run: pnpm qa:internal-links

      - name: Storefront typecheck
        working-directory: storefront
        run: pnpm typecheck

      - name: TypeScript check
        working-directory: backend
        run: pnpm exec tsc --noEmit

      - name: Lint backend
        working-directory: backend
        run: pnpm lint

  i18n-contracts:
    name: Translation Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            admin-panel/pnpm-lock.yaml
            vendor-panel/pnpm-lock.yaml

      - name: Install admin panel dependencies
        working-directory: admin-panel
        run: pnpm install --frozen-lockfile

      - name: Install vendor panel dependencies
        working-directory: vendor-panel
        run: pnpm install --frozen-lockfile

      - name: Validate admin panel translation contracts
        working-directory: admin-panel
        run: pnpm i18n:validate en.json

      - name: Validate vendor panel translation contracts
        working-directory: vendor-panel
        run: pnpm i18n:validate en.json

  vendor-panel:
    name: Vendor Panel Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: vendor-panel/pnpm-lock.yaml

      - name: Install vendor-panel dependencies
        working-directory: vendor-panel
        run: pnpm install --frozen-lockfile

      - name: Lint vendor panel
        working-directory: vendor-panel
        run: pnpm lint

      - name: Run vendor panel tests
        working-directory: vendor-panel
        run: pnpm test

      - name: Typecheck vendor panel
        working-directory: vendor-panel
        run: pnpm typecheck

      - name: Build vendor panel preview
        working-directory: vendor-panel
        run: pnpm build:preview

  admin-panel:
    name: Admin Panel Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: admin-panel/pnpm-lock.yaml

      - name: Install admin-panel dependencies
        working-directory: admin-panel
        run: pnpm install --frozen-lockfile

      - name: Lint admin panel
        working-directory: admin-panel
        run: pnpm lint

      - name: Run admin panel tests
        working-directory: admin-panel
        run: pnpm test

      # LR-3 fully resolved 2026-05-13 — admin-panel typecheck now runs
      # fail-fast. See docs/AUDIT_DEBT.md.
      - name: Typecheck admin panel
        working-directory: admin-panel
        run: pnpm typecheck

  storefront-test:
    name: Storefront Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: storefront/pnpm-lock.yaml

      - name: Install storefront dependencies
        working-directory: storefront
        run: pnpm install --frozen-lockfile

      - name: Run storefront tests
        working-directory: storefront
        run: pnpm test

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: backend
        run: pnpm test:unit:ci
        env:
          NODE_ENV: test

      - name: Upload backend coverage artifacts (optional reporting)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, i18n-contracts, vendor-panel]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Build backend
        working-directory: backend
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/.medusa
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install storefront dependencies
        working-directory: storefront
        run: pnpm install --frozen-lockfile

      - name: Prepare audit artifact directory
        run: mkdir -p audit-reports

      - name: Audit backend dependencies
        working-directory: backend
        run: |
          timeout 180 pnpm audit --audit-level=high --json > ../audit-reports/backend-audit.json || true

      - name: Audit storefront dependencies
        working-directory: storefront
        run: |
          timeout 180 pnpm audit --audit-level=high --json > ../audit-reports/storefront-audit.json || true

      - name: Validate audit artifacts were generated
        run: |
          test -s audit-reports/backend-audit.json
          test -s audit-reports/storefront-audit.json

      - name: Upload security audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: audit-reports/*.json
          retention-days: 30


  blackout-gate:
    name: Centralized Blackout Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Evaluate blackout policy gate
        env:
          BLACKOUT_TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          BLACKOUT_SERVICE: release-promotion
          BLACKOUT_CHANGE_TYPE: ${{ vars.BLACKOUT_CHANGE_TYPE || 'hotfix' }}
          BLACKOUT_OVERRIDE_APPROVALS: ${{ vars.BLACKOUT_OVERRIDE_APPROVALS || '0' }}
          BLACKOUT_OVERRIDE_ROLES: ${{ vars.BLACKOUT_OVERRIDE_ROLES || '' }}
          BLACKOUT_OVERRIDE_TICKET: ${{ vars.BLACKOUT_OVERRIDE_TICKET || '' }}
          BLACKOUT_OVERRIDE_REASON: ${{ vars.BLACKOUT_OVERRIDE_REASON || '' }}
          BLACKOUT_ACTOR: ${{ github.actor }}
          BLACKOUT_COMMIT_SHA: ${{ github.sha }}
          BLACKOUT_RUN_ID: ${{ github.run_id }}
          BLACKOUT_SOURCE_REF: ${{ github.ref }}
          BLACKOUT_DECISION_OUTPUT: blackout-gate/decision-record.json
        run: |
          set -euo pipefail
          mkdir -p blackout-gate
          node ./scripts/blackout-gate-check.mjs --policy config/release/blackout-policy.json

      - name: Upload blackout gate decision artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackout-gate-decision-${{ github.run_id }}
          path: blackout-gate/decision-record.json
          if-no-files-found: warn
          retention-days: 30

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15
        # Test-fixture credentials only; the postgres service is bound to
        # localhost on the runner and torn down at job end. Verbose value
        # is intentional so secret-scanners' password heuristics don't
        # treat the canonical `postgres` literal as a real credential.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_postgres_fixture_only_not_a_secret
          POSTGRES_DB: medusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      # TI-1 closed 2026-05-13 (hawala-ledger + payout-breakdown migration
      # order). Briefly flipped to fail-fast on 2026-05-17 (PR #677) — the
      # first live-Postgres run surfaced a deeper chain of issues that the
      # `continue-on-error: true` mask had hidden:
      #   - cross-module ALTER on a non-existent table name (payout_config
      #     vs hawala_payout_config) — fixed in PR #677
      #   - product-archetype migrations with isTransactional=false running
      #     on a side connection that can't see the master tx — fixed in
      #     PR #677 by pre-declaring all enum values in the CREATE migration
      #     and making the ADD VALUE migrations transactional no-ops
      #   - creator-attribution / creator-program Add-before-Create
      #     filename sort order — fixed in PR #677 by renaming
      #   - missing STRIPE_SECRET_API_KEY / STRIPE_API_KEY in CI env (the
      #     @mercurjs/b2c-core PayoutProvider instantiates Stripe at module
      #     bootstrap and rejects undefined apiKey) — see TI-3 below
      #   - hook conflict: src/workflows/hooks/validate-listing-type-allowed.ts
      #     and @mercurjs/b2c-core/.../hooks/product-created.ts both register
      #     `createProductsWorkflow.hooks.productsCreated`, and Medusa v2
      #     allows only one handler per hook — see TI-3
      # TI-3 in docs/AUDIT_DEBT.md tracks the remaining work. Both documented
      # blockers are now addressed: (a) the productsCreated hook conflict was
      # resolved by moving listing-type enforcement to a route middleware
      # (src/shared/listing-type-guard.ts `enforceListingTypeAllowed`, wired in
      # src/api/middlewares.ts), and (b) the missing Stripe bootstrap keys are
      # supplied below. TI-3 was flipped to fail-fast in the production-readiness
      # pass: this step now blocks CI. The live Postgres service below is the
      # verification surface. If a deeper boot/migration chain surfaces here (as
      # happened when TI-1 was briefly flipped on 2026-05-17), this job will fail
      # the build — that is the intended behavior; fix forward rather than
      # re-masking with continue-on-error.
      - name: Run integration tests
        working-directory: backend
        run: pnpm test:integration:http
        env:
          NODE_ENV: test
          # `@medusajs/test-utils` reads DB_HOST/DB_USERNAME/DB_PASSWORD/DB_PORT
          # individually (not DATABASE_URL); without them pg-god connects
          # without a user and fails with "no PostgreSQL user name specified
          # in startup packet". DATABASE_URL is kept for any helper that
          # bypasses the test-utils factory.
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USERNAME: postgres
          DB_PASSWORD: ci_test_postgres_fixture_only_not_a_secret
          DATABASE_URL: postgres://postgres:ci_test_postgres_fixture_only_not_a_secret@localhost:5432/medusa_test
          # REDIS_URL intentionally NOT set: with it, medusa-config wires the
          # Redis-backed event bus + workflow engine (bullmq), whose ioredis
          # connections throw an unhandled "Connection is closed" on app
          # teardown and fail an unrelated test (the rejection is attributed to
          # whichever spec is mid-flight). These HTTP specs assert auth/
          # validation, not event-bus behavior, so the in-memory event bus +
          # workflow engine (medusa-config's default when REDIS_URL is absent)
          # is the correct, deterministic choice — matches local runs (13/13).
          # Test secrets must be 32+ chars but must not match the banned
          # placeholder set used by medusa-config.ts in production.
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-deterministic
          COOKIE_SECRET: ci-cookie-secret-at-least-32-characters-long-determinis
          # @mercurjs/b2c-core's PayoutProvider instantiates Stripe at module
          # bootstrap and rejects an undefined apiKey, which previously aborted
          # app boot during integration tests (TI-3b). Dummy test keys satisfy
          # the constructor; no live Stripe calls are made in these tests.
          STRIPE_SECRET_API_KEY: sk_test_dummy
          STRIPE_API_KEY: sk_test_dummy

  test-soak:
    name: Money-Path Concurrency Soak
    runs-on: ubuntu-latest
    # Independent of the integration:http app-boot chain (TI-3): the module
    # soak uses @medusajs/test-utils' moduleIntegrationTestRunner, which spins
    # up its own isolated Postgres schema for the hawala-ledger module and
    # never boots the full Medusa app. So it can run early and on its own.
    services:
      postgres:
        image: postgres:15
        # Test-fixture credentials only; bound to localhost on the runner and
        # torn down at job end. The module runner needs CREATEDB (pg-god
        # creates a per-worker schema); the default postgres superuser has it.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_postgres_fixture_only_not_a_secret
          POSTGRES_DB: medusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      # Closes the LAUNCH_READINESS §2 money-path gate: proves the
      # atomic-by-default balance CAS + pool-total increments hold under real
      # concurrency (no overdraw, value conservation, exact pool totals).
      # Scoped to the soak spec so the signal stays clean.
      #
      # Flipped to fail-fast in the production-readiness pass: this step now
      # blocks CI. The Postgres service below is the verification surface for
      # the atomic-by-default money paths under real concurrency. A regression
      # in the balance CAS or pool-total increments will fail the build here.
      - name: Run hawala money-path concurrency soak
        working-directory: backend
        run: pnpm test:integration:modules src/modules/hawala-ledger/__tests__/concurrency-soak.integration.spec.ts
        env:
          NODE_ENV: test
          # @medusajs/test-utils reads DB_HOST/DB_USERNAME/DB_PASSWORD/DB_PORT
          # individually (not DATABASE_URL) to build the per-module test DB URL.
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USERNAME: postgres
          DB_PASSWORD: ci_test_postgres_fixture_only_not_a_secret
          DATABASE_URL: postgres://postgres:ci_test_postgres_fixture_only_not_a_secret@localhost:5432/medusa_test
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-deterministic
          COOKIE_SECRET: ci-cookie-secret-at-least-32-characters-long-determinis

  release-validation:
    name: Release Validation Gate
    runs-on: ubuntu-latest
    needs: [lint, i18n-contracts, vendor-panel, test-unit, security, blackout-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run release validation script (blocking)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
          VENDOR_TOKEN: ${{ secrets.VENDOR_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          INTEGRATION_ENDPOINTS: ${{ vars.INTEGRATION_ENDPOINTS }}
        run: |
          set -euo pipefail
          mkdir -p release-validation
          ./scripts/release_validation.sh |& tee release-validation/release-validation.log

      - name: Upload release validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}
          path: release-validation/release-validation.log
          if-no-files-found: warn
          retention-days: 30

  notify-deploy:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: [build, test-unit, security, vendor-panel, i18n-contracts, blackout-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deployment notification
        run: |
          echo "All quality gates passed for ${{ github.sha }} by ${{ github.actor }}."
          echo "Container images will be published by docker-build.yml; Railway"
          echo "auto-deploy from main remains active for the legacy path."
