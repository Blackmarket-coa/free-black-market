name: End-to-End

on:
  pull_request:
    branches: [main, develop, 'release/**']
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # BLOCKING GATE. Flipped to fail-fast in the production-readiness pass
    # (TI-2 in docs/AUDIT_DEBT.md). The cold-build flakiness this gate
    # previously masked is mitigated below: BuildKit + a buildx builder,
    # base-image pre-pull, and a wider per-service healthcheck wait window
    # (90 x 5s). The Playwright report is still uploaded as an artifact and
    # docker logs are dumped on failure for forensics.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull base and infrastructure images
        run: |
          # Warm the local image cache so cold `docker compose up --build`
          # runs don't pay the full pull cost inside the healthcheck window.
          docker pull node:20-bookworm-slim &
          docker pull nginx:1.27-alpine &
          docker pull postgres:15-alpine &
          docker pull redis:7-alpine &
          docker pull minio/minio:latest &
          wait

      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Bring up the stack
        env:
          DOCKER_BUILDKIT: '1'
          COMPOSE_DOCKER_CLI_BUILD: '1'
          NODE_ENV: development
          MEDUSA_ADMIN_PASSWORD: e2eadmin1234
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_e2e_publishable_placeholder
        run: |
          docker compose up -d --build backend storefront admin-panel vendor-panel
          # Wait for healthy.
          for svc in backend storefront admin-panel vendor-panel; do
            healthy=false
            for i in $(seq 1 90); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "free-black-market-$svc-1" 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then healthy=true; break; fi
              echo "waiting for $svc ($i/90) — current status: $status"
              sleep 5
            done
            if [ "$healthy" != "true" ]; then
              echo "::error::$svc did not become healthy within the wait window"
              docker compose ps
              exit 1
            fi
          done
          docker compose ps

      - name: Run Playwright tests
        working-directory: e2e
        env:
          STOREFRONT_URL: http://localhost:3000
          ADMIN_URL: http://localhost:7000
          VENDOR_URL: http://localhost:7001
        run: npx playwright test

      - name: Diagnostic dump on failure
        if: failure()
        run: |
          echo "::group::docker compose ps"
          docker compose ps
          echo "::endgroup::"
          for svc in backend storefront admin-panel vendor-panel postgres redis minio minio-init; do
            echo "::group::logs/$svc (tail 200)"
            docker compose logs --tail=200 "$svc" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Tear down stack
        if: always()
        run: docker compose down -v
