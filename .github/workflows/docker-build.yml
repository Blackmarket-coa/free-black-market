name: Docker Build & Publish

on:
  push:
    branches: [main, develop, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  # For the image scan's SARIF upload. It scans what the build job just pushed,
  # so it lives here rather than in security.yml — see the `trivy-image` job.
  security-events: write

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: backend
            image: free-black-market-backend
          - app: storefront
            context: storefront
            image: free-black-market-storefront
          - app: admin-panel
            context: admin-panel
            image: free-black-market-admin-panel
          - app: vendor-panel
            context: vendor-panel
            image: free-black-market-vendor-panel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # The storefront's NEXT_PUBLIC_* values are inlined into the bundle at
      # build time by Next.js, so they MUST be passed as build args here (runtime
      # env cannot override them). Sourced from repo Variables / Secrets with
      # production-sane fallbacks; set `NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY` and
      # `REVALIDATE_SECRET` as repo Secrets for a working production storefront.
      - name: Resolve storefront build args
        id: sfargs
        if: matrix.app == 'storefront'
        run: |
          {
            echo 'args<<SFARGS_EOF'
            echo "NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL || 'https://api.freeblackmarket.com' }}"
            echo "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}"
            echo "NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://freeblackmarket.com' }}"
            echo "NEXT_PUBLIC_DEFAULT_REGION=${{ vars.NEXT_PUBLIC_DEFAULT_REGION || 'us' }}"
            echo "NEXT_PUBLIC_STRIPE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_KEY }}"
            echo "REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}"
            echo "NEXT_PUBLIC_VENDOR_URL=${{ vars.NEXT_PUBLIC_VENDOR_URL || 'https://vendor.freeblackmarket.com' }}"
            echo "NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME || 'Black Market Coalition' }}"
            echo "NEXT_PUBLIC_SITE_DESCRIPTION=${{ vars.NEXT_PUBLIC_SITE_DESCRIPTION || 'Black Market Coalition' }}"
            echo "NEXT_PUBLIC_ALGOLIA_ID=${{ vars.NEXT_PUBLIC_ALGOLIA_ID }}"
            echo "NEXT_PUBLIC_ALGOLIA_SEARCH_KEY=${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}"
            echo "NEXT_PUBLIC_MATRIX_ELEMENT_URL=${{ vars.NEXT_PUBLIC_MATRIX_ELEMENT_URL }}"
            echo "NEXT_PUBLIC_MATRIX_SERVER_NAME=${{ vars.NEXT_PUBLIC_MATRIX_SERVER_NAME }}"
            echo SFARGS_EOF
          } >> "$GITHUB_OUTPUT"

      # The Vite panels (admin/vendor) inline VITE_* values into their static
      # bundles at build time exactly like the storefront, so the backend URL
      # and publishable key MUST be passed as build args here — a runtime
      # env_file cannot change an already-built SPA. Without this the panels
      # ship with an empty backend URL and are unreachable (login dead on
      # arrival). Reuses the same backend URL / publishable key as the
      # storefront (the panels talk to the same API); a superset is fine since
      # each panel's build ignores VITE_* vars it doesn't read.
      - name: Resolve panel build args
        id: panelargs
        if: matrix.app == 'admin-panel' || matrix.app == 'vendor-panel'
        run: |
          {
            echo 'args<<PANELARGS_EOF'
            echo "VITE_MEDUSA_BACKEND_URL=${{ vars.PANEL_MEDUSA_BACKEND_URL || vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL || 'https://api.freeblackmarket.com' }}"
            echo "VITE_PUBLISHABLE_API_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}"
            echo "VITE_MEDUSA_STOREFRONT_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://freeblackmarket.com' }}"
            echo "VITE_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://freeblackmarket.com' }}"
            echo PANELARGS_EOF
          } >> "$GITHUB_OUTPUT"

      # docker/build-push-action with `provenance: true` produces a manifest
      # list that the local docker daemon's image store cannot import via
      # `load`. On PRs we don't push to the registry — we only verify the
      # Dockerfile builds — so we skip both `load` and the manifest-list
      # outputs. On push to main / tags / release branches we still publish
      # with full provenance + SBOM attestations.
      - name: Build${{ github.event_name != 'pull_request' && ' & push' || '' }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.sfargs.outputs.args }}
            ${{ steps.panelargs.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Image build summary
        run: |
          echo "Built ${{ matrix.app }} image with tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    # The whole point of moving this job out of `security.yml`. There it carried
    # a literal `needs: []` — the shape of a dependency that could not be
    # written, because `needs` cannot reach across workflows. Both workflows
    # trigger on push to main and start within seconds of each other, so the
    # scan raced the build: on 2026-08-04 it fired 30s after the push and got
    # `MANIFEST_UNKNOWN: manifest unknown` for a tag docker-build was still
    # building. Here the ordering is a fact, not a hope.
    needs: build
    # Only for pushes that actually publish. PR builds run with `push: false`
    # (see the build step), so there is no image in the registry to scan and the
    # job would fail on absence rather than on findings.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            image: free-black-market-backend
          - app: storefront
            image: free-black-market-storefront
          - app: admin-panel
            image: free-black-market-admin-panel
          - app: vendor-panel
            image: free-black-market-vendor-panel
    steps:
      # This job scans a registry image, not the working tree, so it carried no
      # checkout for most of its life. It needs one purely because `trivyignores`
      # below names a file in the repository: trivy resolves that path on the
      # runner's disk, and without a checkout it exits 1 with "cannot find
      # ignorefile" before scanning anything — the gate reporting failure without
      # ever having looked at an image.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .trivyignore.image
          sparse-checkout-cone-mode: false

      # The `build` job publishes `sha-<7-char>` tags via docker/metadata-action
      # (`type=sha,prefix=sha-,format=short`). `${{ github.sha }}` is the full
      # 40-char SHA — using it raw looks up a tag that was never published.
      - name: Compute image reference
        id: image_ref
        # The owner is lowercased because an OCI reference's repository path
        # must be lowercase, while `github.repository_owner` preserves the
        # organisation's own casing ("Blackmarket-coa"). Interpolating it raw
        # produced `could not parse reference` on all four matrix jobs on every
        # push to main — the scan never ran at all, so this gate spent that whole
        # period reporting failure rather than security findings.
        #
        # Lowercase is also what actually got pushed: the build job above runs
        # this same name through docker/metadata-action, which normalises it. So
        # this is not a new convention, it is the one the registry already uses.
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "value=ghcr.io/${owner}/${{ matrix.image }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # `needs: build` guarantees the push returned; this covers the gap between
      # the registry accepting a manifest and serving it. Deliberately short and
      # bounded — it is insurance against propagation lag, not a substitute for
      # the ordering above, and a long poll here would hide a genuinely missing
      # image behind a timeout.
      - name: Wait for the manifest to be servable
        # Values arrive as env rather than `${{ }}` inside the script: a secret
        # interpolated into a command line ends up in the process table and in
        # `set -x` output, and an actor name is attacker-influenced text being
        # pasted into a shell.
        env:
          IMAGE_REF: ${{ steps.image_ref.outputs.value }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${IMAGE_REF%:*}"; repo="${repo#ghcr.io/}"
          tag="${IMAGE_REF##*:}"
          token="$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 -w0)"
          for attempt in 1 2 3 4 5; do
            # `|| true` matters: the step runs under `bash -e`, where a failed
            # curl inside a command substitution aborts the whole step. A DNS
            # blip would then hard-fail the build rather than being retried —
            # the same shape of accident this job is here to stop repeating.
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Basic ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/${repo}/manifests/${tag}" || true)"
            if [ "$code" = "200" ]; then
              echo "manifest for ${tag} is servable"
              exit 0
            fi
            echo "attempt ${attempt}: ghcr returned ${code} for ${repo}:${tag}, retrying"
            sleep $(( attempt * 5 ))
          done
          # Not a hard failure: let trivy be the one to report it, so the log
          # shows the scanner's own error rather than a curl status code.
          echo "manifest still not servable; continuing so trivy reports it"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image_ref.outputs.value }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          # This gate previously passed no ignore file at all, so nothing could
          # be triaged for it. `.trivyignore.image` is deliberately a separate
          # list from the filesystem scan's: findings vendored inside a
          # third-party binary we ship are not the same as findings in our own
          # lockfile, and sharing one file would mean suppressing an image-only
          # CVE also switched off the filesystem gate's regression detection for
          # it — which is exactly the case for CVE-2026-69152, fixed in our
          # lockfile by #773 but unreachable inside pnpm's bundle.
          trivyignores: '.trivyignore.image'
          # Without this, trivy-action overrides `severity` to include all
          # severities when `format: sarif`, so the `exit-code: 1` gate
          # trips on LOW/MEDIUM findings too — defeating the stated
          # "HIGH/CRITICAL only" gate above. Mirrors the trivy-fs fix
          # landed in commit 42de0b6 (SD-15 audit closed the same gap here).
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'trivy-${{ matrix.app }}.sarif'

      - name: Upload SARIF
        # `always()` alone tried to upload a file the scan never produced when
        # it failed before writing one, adding a second, louder error
        # ("Path does not exist") on top of the real cause. Guarding on the
        # file keeps the actual failure the only thing in the log.
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.app)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-image-${{ matrix.app }}
