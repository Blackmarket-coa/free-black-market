name: Security Scanning

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  schedule:
    # Nightly at 03:17 UTC.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

permissions:
  contents: read
  security-events: write
  pull-requests: read
  actions: read

jobs:
  posture-a-compliance:
    name: Posture A Compliance (CCR closed-loop invariants)
    runs-on: ubuntu-latest
    # This gate enforces the architectural invariants documented in
    # docs/POSTURE_A_COMPLIANCE.md. A failing test here means Coalition
    # Credits could move without a goods/services purchase context — which
    # collapses the payment-facilitator exemption and triggers FinCEN MSB
    # classification. Do NOT add continue-on-error, do NOT downgrade to a
    # warning. Loosening these tests requires a written compliance review.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Run Posture A invariants
        working-directory: backend
        run: pnpm test:posture-a
        env:
          NODE_ENV: test

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Set GITLEAKS_LICENSE in repo secrets to lift the org-scan rate limit;
          # personal repos can leave it unset.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The dependency-review action requires the repository's Dependency
      # Graph to be enabled. Public repos have it on by default; private /
      # internal repos need GitHub Advanced Security. Until GHAS is
      # provisioned, the action errors with "Dependency review is not
      # supported on this repository." Step-level continue-on-error keeps
      # the JOB conclusion green; gitleaks + Trivy + CodeQL still cover
      # the security baseline.
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SD-1..SD-5 (mikro-orm/lodash/picomatch/axios/next) landed 2026-05-13
      # and `.trivyignore` is now empty (header only). Trivy is a hard gate;
      # any new HIGH/CRITICAL finding fails CI and must be triaged into
      # `.trivyignore` with an accompanying `SD-*` row in docs/AUDIT_DEBT.md
      # before the gate can be made green again.
      - name: Trivy fs (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          # Without this, trivy-action overrides `severity` to include all
          # severities when `format: sarif`, so the `exit-code: 1` gate
          # trips on LOW/MEDIUM findings too — defeating the stated
          # "HIGH/CRITICAL only" gate above. `true` keeps both the SARIF
          # and the exit-code filter consistent with the documented intent.
          limit-severities-for-sarif: true
          # `node_modules` alone matches only top-level on Trivy 0.70+;
          # `**/node_modules` skips nested package vendoring too (notably
          # `@stellar/js-xdr`'s vendored Ruby Gemfile.lock which is not
          # used at runtime in our Node app).
          skip-dirs: 'node_modules,**/node_modules,.git,**/dist,**/.next,**/.medusa,e2e/test-results'
          trivyignores: '.trivyignore'
          format: 'sarif'
          output: 'trivy-fs.sarif'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-js

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        app: [backend, storefront, admin-panel, vendor-panel]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./${{ matrix.app }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.app }}.cdx.json
          artifact-name: sbom-${{ matrix.app }}

# The container image scan used to live here, as a `trivy-image` job carrying a
# literal `needs: []`. That empty `needs` was the shape of a dependency nobody
# could express: the images it scans are produced by `docker-build.yml`, and
# `needs` cannot reach across workflows. Both workflows trigger on push to main
# and start together, so the scan raced the build and lost — MANIFEST_UNKNOWN on
# a tag that had not been pushed yet.
#
# It now lives in `docker-build.yml` as a job that genuinely `needs: build`,
# where the ordering is a fact rather than a hope. See that file.
