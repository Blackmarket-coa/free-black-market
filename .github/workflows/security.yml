name: Security Scanning

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  schedule:
    # Nightly at 03:17 UTC.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

permissions:
  contents: read
  security-events: write
  pull-requests: read
  actions: read

jobs:
  posture-a-compliance:
    name: Posture A Compliance (CCR closed-loop invariants)
    runs-on: ubuntu-latest
    # This gate enforces the architectural invariants documented in
    # docs/POSTURE_A_COMPLIANCE.md. A failing test here means Coalition
    # Credits could move without a goods/services purchase context — which
    # collapses the payment-facilitator exemption and triggers FinCEN MSB
    # classification. Do NOT add continue-on-error, do NOT downgrade to a
    # warning. Loosening these tests requires a written compliance review.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Run Posture A invariants
        working-directory: backend
        run: pnpm test:posture-a
        env:
          NODE_ENV: test

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Set GITLEAKS_LICENSE in repo secrets to lift the org-scan rate limit;
          # personal repos can leave it unset.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The dependency-review action requires the repository's Dependency
      # Graph to be enabled. Public repos have it on by default; private /
      # internal repos need GitHub Advanced Security. Until GHAS is
      # provisioned, the action errors with "Dependency review is not
      # supported on this repository." Step-level continue-on-error keeps
      # the JOB conclusion green; gitleaks + Trivy + CodeQL still cover
      # the security baseline.
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before the scan, because it checks a precondition the scan's result
      # depends on. Most CVEs that do NOT appear in `.trivyignore` are absent
      # because an override fixed them — so if the overrides stop binding, Trivy
      # reads a lockfile that genuinely contains the old versions and reports
      # them as intended. A clean scan and a silently unpinned tree look
      # identical from here; this is what tells them apart.
      #
      # Not hypothetical: pnpm 11 moves `overrides` out of package.json and
      # ignores the new location entirely when `--ignore-workspace` is passed —
      # which every install below does — with no warning at all. See SD-24.
      #
      # Needs no dependencies (plain Node over the lockfiles), so it runs first
      # and costs nothing.
      - name: Check dependency overrides still bind
        run: node scripts/check-override-coverage.mjs

      # SD-1..SD-5 (mikro-orm/lodash/picomatch/axios/next) landed 2026-05-13
      # and `.trivyignore` is now empty (header only). Trivy is a hard gate;
      # any new HIGH/CRITICAL finding fails CI and must be triaged into
      # `.trivyignore` with an accompanying `SD-*` row in docs/AUDIT_DEBT.md
      # before the gate can be made green again.
      - name: Trivy fs (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          # Without this, trivy-action overrides `severity` to include all
          # severities when `format: sarif`, so the `exit-code: 1` gate
          # trips on LOW/MEDIUM findings too — defeating the stated
          # "HIGH/CRITICAL only" gate above. `true` keeps both the SARIF
          # and the exit-code filter consistent with the documented intent.
          limit-severities-for-sarif: true
          # `node_modules` alone matches only top-level on Trivy 0.70+;
          # `**/node_modules` skips nested package vendoring too (notably
          # `@stellar/js-xdr`'s vendored Ruby Gemfile.lock which is not
          # used at runtime in our Node app).
          skip-dirs: 'node_modules,**/node_modules,.git,**/dist,**/.next,**/.medusa,e2e/test-results'
          trivyignores: '.trivyignore'
          format: 'sarif'
          output: 'trivy-fs.sarif'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-js

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        app: [backend, storefront, admin-panel, vendor-panel]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./${{ matrix.app }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.app }}.cdx.json
          artifact-name: sbom-${{ matrix.app }}

  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: []
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            image: free-black-market-backend
          - app: storefront
            image: free-black-market-storefront
          - app: admin-panel
            image: free-black-market-admin-panel
          - app: vendor-panel
            image: free-black-market-vendor-panel
    steps:
      # This job scans a registry image, not the working tree, so it carried no
      # checkout for most of its life. It needs one now purely because
      # `trivyignores` below names a file in the repository: trivy resolves that
      # path on the runner's disk, and without a checkout it exits 1 with
      # "cannot find ignorefile" before scanning anything — the gate reports
      # failure without ever having looked at the image.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .trivyignore.image
          sparse-checkout-cone-mode: false

      # docker-build.yml publishes images with `sha-<7-char>` tags (via
      # docker/metadata-action `type=sha,prefix=sha-,format=short`).
      # `${{ github.sha }}` is the full 40-char SHA — using it raw makes
      # trivy-action look up a tag that was never published and fail with
      # image-not-found on every push to main. Compute the short SHA here
      # so the image-ref matches what docker-build actually pushed.
      - name: Compute image reference
        id: image_ref
        # The owner is lowercased because an OCI reference's repository path
        # must be lowercase, while `github.repository_owner` preserves the
        # organisation's own casing ("Blackmarket-coa"). Interpolating it raw
        # produced `could not parse reference` on all four matrix jobs on every
        # push to main — the scan never ran at all, so this gate has been
        # reporting failure rather than security findings.
        #
        # Lowercase is also what actually got pushed: docker-build.yml builds
        # this same ref through docker/metadata-action, which normalises the
        # image name. So this is not a new convention, it is the one the
        # registry already uses.
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "value=ghcr.io/${owner}/${{ matrix.image }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image_ref.outputs.value }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          # This gate previously passed no ignore file at all, so nothing could
          # be triaged for it. `.trivyignore.image` is deliberately a separate
          # list from the filesystem scan's: findings vendored inside a
          # third-party binary we ship are not the same as findings in our own
          # lockfile, and sharing one file would mean suppressing an image-only
          # CVE also switched off the filesystem gate's regression detection for
          # it — which is exactly the case for CVE-2026-69152, fixed in our
          # lockfile by #773 but unreachable inside pnpm's bundle.
          trivyignores: '.trivyignore.image'
          # Without this, trivy-action overrides `severity` to include all
          # severities when `format: sarif`, so the `exit-code: 1` gate
          # trips on LOW/MEDIUM findings too — defeating the stated
          # "HIGH/CRITICAL only" gate above. Mirrors the trivy-fs fix
          # landed in commit 42de0b6 (SD-15 audit closed the same gap here).
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'trivy-${{ matrix.app }}.sarif'

      - name: Upload SARIF
        # `always()` alone tried to upload a file the scan never produced when
        # it failed before writing one, adding a second, louder error
        # ("Path does not exist") on top of the real cause. Guarding on the
        # file keeps the actual failure the only thing in the log.
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.app)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-image-${{ matrix.app }}
