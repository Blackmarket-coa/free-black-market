openapi: 3.1.0
info:
  title: BMC Entitlements Service
  version: 1.0.0
  summary: |
    Stable boundary between the FBM substrate layer and the Blackout interface
    layer. Answers four questions for any (Matrix MXID, resource) pair: access,
    economic standing, governance roles, and coalition membership.
  description: |
    Canonical, authoritative contract for the FBM-hosted entitlements service
    consumed by Blackout to gate Matrix room access, sync power levels, and
    render Coalition Credits. This revision matches the normative
    FreeBlackMarket -> Blackout work order (§4): path-param `{mxid}` routes, the
    `read|write|administer` action vocabulary, `urn:fbm:*` resource URNs, and the
    minor-units economic-standing shape.

    Implemented under
    `backend/src/api/v1/integrations/blackout/entitlements/**`.

    Sibling contract: `docs/contracts/marketplace-layer.md`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: BMC Maintainers
    url: https://github.com/Blackmarket-coa/free-black-market
servers:
  - url: https://fbm.local/v1/integrations/blackout
    description: Blackout integration surface (HTTP, service-token bearer)
  - url: http://localhost:9000/v1/integrations/blackout
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: access
    description: Resource access decisions for a given MXID and resource URN.
  - name: economic-standing
    description: Coalition Credits balance, payouts, sales volume, reward eligibility.
  - name: governance-roles
    description: Coalition roles, derived Matrix ACLs and FBM commerce permissions.
  - name: coalitions
    description: Coalition memberships and coalition-scoped entitlements.
  - name: summary
    description: Combined economic standing + governance roles + coalition memberships.

paths:
  /entitlements/access/{mxid}:
    get:
      tags: [access]
      operationId: checkAccess
      summary: Access decision for a (mxid, urn, action) triple.
      parameters:
        - $ref: '#/components/parameters/MxidPath'
        - name: urn
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ResourceUrn' }
        - name: action
          in: query
          required: true
          schema: { $ref: '#/components/schemas/AccessAction' }
      responses:
        '200':
          description: Decision rendered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceDisabled' }

  /entitlements/access-batch/{mxid}:
    post:
      tags: [access]
      operationId: checkAccessBatch
      summary: Batch access decisions for one MXID.
      description: Returns one result per check, in the SAME ORDER as the input.
      parameters:
        - $ref: '#/components/parameters/MxidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checks]
              properties:
                checks:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [urn, action]
                    properties:
                      urn: { $ref: '#/components/schemas/ResourceUrn' }
                      action: { $ref: '#/components/schemas/AccessAction' }
      responses:
        '200':
          description: Decisions in input order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccessResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceDisabled' }

  /entitlements/economic-standing/{mxid}:
    get:
      tags: [economic-standing]
      operationId: getEconomicStanding
      summary: Economic standing for an MXID.
      description: |
        Coalition Credits balance, pending payouts, 30-day vendor sales volume,
        and creator reward eligibility. Backed by `hawala-ledger`. Returns zeroed
        totals (not 404) for MXIDs that have not yet transacted.
      parameters:
        - $ref: '#/components/parameters/MxidPath'
      responses:
        '200':
          description: Standing snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EconomicStanding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceDisabled' }

  /entitlements/governance-roles/{mxid}:
    get:
      tags: [governance-roles]
      operationId: getGovernanceRoles
      summary: Governance roles held by an MXID.
      description: |
        Roles held within each coalition, the Matrix ACLs that follow from those
        roles (applied verbatim by Blackout's ACL sync worker), and the FBM
        commerce permissions they confer.
      parameters:
        - $ref: '#/components/parameters/MxidPath'
      responses:
        '200':
          description: Role snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/GovernanceRole' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceDisabled' }

  /entitlements/coalitions/{mxid}:
    get:
      tags: [coalitions]
      operationId: getCoalitionMemberships
      summary: Coalition memberships for an MXID.
      parameters:
        - $ref: '#/components/parameters/MxidPath'
      responses:
        '200':
          description: Membership snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [memberships]
                properties:
                  memberships:
                    type: array
                    items: { $ref: '#/components/schemas/CoalitionMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceDisabled' }

  /entitlements/summary/{mxid}:
    get:
      tags: [summary]
      operationId: getSummary
      summary: Combined entitlements summary (Q2 + Q3 + Q4).
      description: |
        Economic standing, governance roles, and coalition memberships in one
        response plus `cacheTtlSeconds`. Blackout caps the summary cache at 30s.
      parameters:
        - $ref: '#/components/parameters/MxidPath'
      responses:
        '200':
          description: Summary snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceDisabled' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The Blackout deployment service token (`ENTITLEMENTS_SERVICE_TOKEN`).
        A valid Blackout OAuth JWT is also accepted for back-compat.

  parameters:
    MxidPath:
      name: mxid
      in: path
      required: true
      description: URL-encoded Matrix MXID, e.g. `%40alice%3Atheblackout.app`.
      schema: { $ref: '#/components/schemas/Mxid' }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid service token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceDisabled:
      description: |
        Blackout integration is not enabled on the backend
        (`FBM_BLACKOUT_INTEGRATION != 1`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Mxid:
      type: string
      pattern: '^@[A-Za-z0-9._=/-]+:[A-Za-z0-9.-]+$'
      example: '@alice:theblackout.app'

    AccessAction:
      type: string
      enum: [read, write, administer]

    ResourceUrn:
      type: string
      description: |
        Closed resource taxonomy. One of:
        `urn:fbm:room:<id>`, `urn:fbm:listing:<id>`, `urn:fbm:proposal:<id>`,
        `urn:fbm:fulfillment-node:<id>`, `urn:fbm:ledger-tx:<id>`,
        `urn:fbm:platform:admin`.
      examples:
        - 'urn:fbm:room:!abc123'
        - 'urn:fbm:platform:admin'

    AccessResult:
      type: object
      required: [allowed, source]
      properties:
        allowed: { type: boolean }
        source:
          type: string
          description: |
            What decided the result, e.g. `grant`, `public`, `governance-role`,
            `none`, `pending`, `invalid_urn`.

    EconomicStanding:
      type: object
      required:
        - coalitionCreditsBalanceMinorUnits
        - currency
        - pendingPayouts
        - vendorSalesVolumeMinorUnits30d
        - creatorRewardEligibility
      properties:
        coalitionCreditsBalanceMinorUnits:
          type: integer
          description: Available + pending Coalition Credits in the currency's minor unit.
        currency:
          type: string
          example: USD
        pendingPayouts:
          type: array
          items:
            type: object
            required: [amountMinorUnits, currency]
            properties:
              amountMinorUnits: { type: integer }
              currency: { type: string }
        vendorSalesVolumeMinorUnits30d:
          type: [integer, "null"]
          description: 30-day gross vendor volume in minor units, or null when not a vendor.
        creatorRewardEligibility:
          type: array
          items:
            type: object
            required: [programKey, eligible]
            properties:
              programKey: { type: string }
              eligible: { type: boolean }
        lastSettlementAt:
          type: [string, "null"]
          format: date-time

    GovernanceRole:
      type: object
      required: [coalitionId, role, matrixAcls, commercePermissions]
      properties:
        coalitionId: { type: string }
        role:
          type: string
          description: Role within the coalition (e.g. `vendor`, `steward`, `member`).
        matrixAcls:
          type: array
          description: Applied verbatim by Blackout's ACL sync worker. FBM owns the mapping.
          items:
            type: object
            required: [roomId, powerLevel]
            properties:
              roomId: { type: string }
              powerLevel:
                type: integer
                minimum: 0
                maximum: 100
        commercePermissions:
          type: array
          items: { type: string }
          description: FBM commerce permission keys conferred by the role.
        voteEligibility:
          type: array
          items: { type: string }

    CoalitionMembership:
      type: object
      required: [coalitionId, status, entitlements]
      properties:
        coalitionId: { type: string }
        status:
          type: string
          enum: [active, pending, suspended, departed]
        joinedAt:
          type: string
          format: date-time
        entitlements:
          type: array
          items: { type: string }

    EntitlementsSummary:
      type: object
      required:
        - mxid
        - economicStanding
        - governanceRoles
        - coalitionMemberships
        - cacheTtlSeconds
      properties:
        mxid: { $ref: '#/components/schemas/Mxid' }
        economicStanding: { $ref: '#/components/schemas/EconomicStanding' }
        governanceRoles:
          type: array
          items: { $ref: '#/components/schemas/GovernanceRole' }
        coalitionMemberships:
          type: array
          items: { $ref: '#/components/schemas/CoalitionMembership' }
        cacheTtlSeconds:
          type: integer
          maximum: 30

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
