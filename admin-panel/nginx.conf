server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Liveness/readiness probe.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Build stamp written by the Dockerfile: {"commit":"<sha>"}. `expires -1`
  # (Cache-Control: no-cache) so a browser never shows the previous deploy's
  # SHA; it is not an add_header, so the hardening headers below still apply.
  location = /version.json {
    access_log off;
    expires -1;
    try_files $uri =404;
  }

  # Long-lived hashed assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: serve index.html for unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Standard hardening headers.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Hide nginx version.
  server_tokens off;
}
