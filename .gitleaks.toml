# Gitleaks configuration for free-black-market.
# Extends the default ruleset and allowlists known-safe placeholder strings
# in template / documentation files so legitimate examples don't trip CI.

title = "free-black-market gitleaks config"

# Inherit the upstream default ruleset.
[extend]
useDefault = true

[allowlist]
description = "Project-wide allowlist for documented placeholders & template files."
paths = [
  '''(?i)\.env\.template$''',
  '''(?i)\.env\.staging\.template$''',
  '''(?i)\.env\.railway\.template$''',
  '''(?i)docs/.*\.md$''',
  '''(?i).*README\.md$''',
  '''(?i).*CHANGELOG\.md$''',
  '''pnpm-lock\.yaml$''',
  '''yarn\.lock$''',
  '''package-lock\.json$''',
  # Build artefacts (gitignored, but if a developer scans locally with
  # `--no-git` we don't want false positives on Next's per-build preview
  # mode keys, k6 summaries, .medusa output, etc.).
  '''.*/\.next/.*''',
  '''.*/\.medusa/.*''',
  '''.*/dist/.*''',
  '''.*/storybook-static/.*''',
  '''.*/coverage/.*''',
  # Test fixtures / unit-test secrets: these are deterministic strings used
  # to sign / verify HMACs in tests and are not secrets in any real sense.
  '''.*/__tests__/.*\.(spec|test)\.(ts|tsx|js)$''',
  '''.*/test/.*\.(spec|test)\.(ts|tsx|js)$''',
  '''.*\.(spec|test)\.(ts|tsx|js)$''',
  # NOTE: there is deliberately no `.github/workflows/**` entry here. One used
  # to exist, written as `.*/\.github/workflows/.*\.ya?ml$`, and it never
  # matched anything: the `.*/` requires a slash before `.github`, while these
  # files live at `.github/workflows/ci.yml` with no leading directory. Rather
  # than repair it, the CI fixtures it was meant to cover are allowlisted by
  # value below, so a genuinely leaked credential pasted into a workflow is
  # still reported.
]

regexes = [
  # CHANGE_ME_* placeholders enforced by scripts/assert-env.mjs
  '''CHANGE_ME_[A-Za-z0-9_]+''',
  # Documented Stripe test placeholders
  '''sk_test_your[_a-z0-9]+''',
  '''pk_test_your[_a-z0-9]+''',
  '''pk_test_local_stripe_key_for_dev_only''',
  '''pk_test_replace_with_real_stripe_publishable_key''',
  # CI / e2e / perf-job placeholders
  '''pk_(e2e|perf|local|test)_[a-z0-9_]+''',
  # Integration-test JWT / cookie secrets in .github/workflows/*.yml. These
  # are non-secret by construction: they exist because medusa-config.ts
  # requires 32+ chars, and `scripts/assert-env.mjs` rejects the banned
  # placeholder set in production, so CI needs a long string that is
  # obviously not a credential. The value says as much in words.
  #
  # Matched by value rather than by allowlisting the whole workflow path:
  # a real token pasted into a workflow must still be reported, and a new
  # fixture that does not follow this naming should trip the gate so
  # someone has to look at it.
  '''(test|ci)-(jwt|cookie)-secret-at-least-32-[a-z0-9-]+''',
  '''ci_test_postgres_fixture_only_not_a_secret''',
  # Resend documented placeholders
  '''re_[a-z]+_your[_a-z0-9]+''',
  # Stellar key documentation example
  '''Syour56characterstellarsecretkey''',
  # The literal "supersecret" only appears in audit-debt docs after Phase 1
  '''supersecret''',
  # Marketplace webhook test fixtures
  '''fbm_whsec_[a-f0-9]+''',
]
