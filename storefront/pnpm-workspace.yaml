# Dependency overrides.
#
# These live here rather than in package.json's `pnpm.overrides` because
# pnpm 11 stopped reading that field. Nearly every entry pins a CVE fix, so
# a silently-dropped override reintroduces the vulnerability while leaving
# every gate green — Trivy reads the lockfile, and the lockfile would just
# say the old version was always intended.
#
# Two things keep that from happening again:
#   - `scripts/check-override-coverage.mjs` asserts every override below
#     actually binds in the resolved lockfile.
#   - installs must NOT pass `--ignore-workspace`. That flag makes pnpm
#     ignore this file entirely, with no warning at all. This directory is
#     its own workspace root precisely so the flag is unnecessary.
overrides:
  # GHSA-73wf-gq98-2v4g / GHSA-c83g-rgw3-j3cx: uncaught crash + prototype
  # write parsing untrusted browserslist-stats.json, and unbounded cache
  # growth to OOM. Both HIGH with a fix, so ignore-unfixed does not spare
  # them. Production here (not in the root or the panels, where
  # browserslist is dev-only and Trivy skips it).
  "browserslist": ">=4.28.7"
  "glob": ">=10.5.0"
  "qs": ">=6.14.2"
  # Seven HIGH advisories are fixed only in 1.20.0: GHSA-3pq3-5fj3-cg6v
  # (HTTP/2 adapter bypasses the configured DNS lookup and proxy control),
  # -542g-h47m-68v8 (DoS via an unhandled 'error' event on the HTTP/2
  # ClientHttp2Session), -c29m-xwm3-cm6r (ReDoS in the fromDataURI data: URL
  # parser, which freezes the Node event loop), -m8m8-qj5v-23w3 (prototype-
  # pollution gadget in the Node HTTP adapter), -mghh-pgcx-3jjj (O(N2) ReDoS
  # in shouldBypassProxy host normalisation), -r4gj-5m52-g5wh (maxRedirects: 0
  # not enforced by the fetch adapter) and -x97p-jq2g-jp4f (prototype-pollution
  # gadget in toFormData).
  #
  # The floor was a bare ">=1.18.0", which PERMITTED 1.20.0 and resolved to the
  # vulnerable 1.18.1 — a caret that allows the fix does not cause the fix.
  # Caret-bounded rather than left bare so a future axios 2.x cannot arrive
  # unreviewed.
  "axios": "^1.20.0"
  # GHSA-7h2j-956f-4vf2 (CVE-2026-25547, HIGH): uncontrolled resource
  # consumption, fixed only in 5.0.1. This is the renamed 5.x line, a separate
  # package from `brace-expansion` above, so it needs its own pin.
  "@isaacs/brace-expansion": "^5.0.1"
  "preact": ">=10.27.3"
  # CVE-2026-75604 and GHSA-2xp9-vwfh-vxw4 are both CRITICAL and both
  # unauthenticated remote code execution — the first on Windows-hosted
  # servers, the second in the Image Optimization API on crafted AVIF input.
  # Fixed in 15.5.24. Pinned exactly rather than caret-ranged, as before, so
  # the resolved version is the reviewed one.
  "next": "15.5.24"
  "picomatch": ">=4.0.4"
  "postcss": ">=8.5.18"
  "esbuild": ">=0.28.1"
  "form-data": ">=4.0.6"
  "vite": "^7.3.5"
  "zod": "4.2.0"
  # brace-expansion: five HIGH DoS advisories across the 1.x/2.x/5.x lines
  # (GHSA-3jxr-9vmj-r5cp, -6j4f-fj2g-mc7p, -mh99-v99m-4gvg, -qhr7-859c-m2p7,
  # -rgw5-rvv9-x895) plus the MODERATE -q2hr-2g5m-vwhr. The highest fix on each
  # line clears all six: 1.1.21, 2.1.7, 5.0.12.
  #
  # Each line is pinned separately because they are not interchangeable. 1.x and
  # 2.x still export the bare function (`module.exports = expandTop`), which
  # `minimatch@3.1.5` requires as `var expand = require('brace-expansion')`;
  # 5.x exports `{ expand }`. Forcing minimatch@3's consumers onto 5.x throws
  # `TypeError: expand is not a function` — that is what broke PR #754 and is
  # why SD-22 suppressed CVE-2026-14257 instead. The backports to 1.1.17/2.1.3
  # landed after SD-22 was written, so the suppression is no longer needed; the
  # export shape of 1.1.21 and 2.1.7 was re-verified before this bump.
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@2": "^2.1.7"
  "brace-expansion@5": "^5.0.12"
  # GHSA-3ppc-4f35-3m26, -23c5-xmqv-rm74, -7r86-cg39-jmmj (all HIGH) across
  # the 3.x / 9.x / 10.x lines. Fixes: 3.1.4, 9.0.7, 10.2.3. Each line is a
  # separate selector key because they are not interchangeable (minimatch@3
  # needs the function-export brace-expansion 1.x -- the SD-22 trap; 10.x
  # needs the named-export 5.x). storefront resolves 3.x and 9.x only.
  "minimatch@3": "^3.1.4"
  "minimatch@9": "^9.0.7"
  # GHSA-25h7-pfq9-p65f and GHSA-rf6f-7fwh-wjgh (both HIGH), eslint's
  # flat-cache serializer. No sibling root carries a pin because backend and
  # root resolve 3.4.2 naturally; the panels and storefront did not.
  "flatted": "^3.4.2"
  # GHSA-52cp-r559-cp3m, -5p4m-2wfm-xmqj, -2883-xcg3-v3hh (all HIGH). Mirrors
  # backend's "js-yaml@4": "^4.3.2" exactly. Selector-scoped so the 3.x line
  # (which still has safeLoad consumers) is never forced onto 4.x.
  "js-yaml@4": "^4.3.2"
  # GHSA-96hv-2xvq-fx4p (HIGH), storybook's dev-server channel. Fixed 8.21.0.
  # Selector-scoped so a future ws 5/6/7 consumer is untouched; caret-bounded.
  "ws@8": "^8.21.0"
  # GHSA-fv7c-fp4j-7gwp / CVE-2026-44728 (HIGH). Caret-bounded: an 8.0.x line
  # exists on the registry. @babel/core stays at 7.28.x -- the plugin's peer is
  # ^7.0.0-0 -- so nothing production-facing moves with it.
  "@babel/plugin-transform-modules-systemjs": "^7.29.4"
  # Four HIGH advisories (GHSA-jqff-g426-hqxp, -f65p-4m7j-42xc,
  # -5jgf-p345-68v8, -fph4-wmhf-6fwf) are only fixed in 3.1.6. The floor
  # was ^3.1.5, which permitted 3.1.6 but left the lockfile resolved at
  # 3.1.5 — a permissive range is not a bump.
  # Floor raised from ^3.1.6 to the real fix: ^3.1.6 PERMITTED 3.1.7 and the
  # lockfile sat on it -- fine by luck, not by construction (CLAUDE.md rule 6).
  "fast-uri": "^3.1.8"
  # CVE-2026-67213: infinite loop in nanoid's customAlphabet. Fixed in the
  # 3.x line at 3.3.17. Caret-bounded on purpose: a bare ">=3.3.17" lets pnpm
  # resolve to nanoid 6, which is ESM-only and breaks every CommonJS require.
  "nanoid@3": "^3.3.18"
  "serialize-javascript": ">=7.0.3"
  # GHSA-rgj7-g3m4-5g8c (HIGH): sharp bundles libheif, and 0.35.3 carries
  # GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545 through it. Fixed in 0.35.4.
  # The floor was >=0.35.0, which permitted 0.35.4 but left the lockfile at
  # 0.35.3 — a permissive range is not a bump.
  # GHSA-wq5f-xc86-pv6w (HIGH, 2026-10-06): sharp's bundled librsvg
  # (CVE-2026-96889), fixed in 0.35.5. Caret-bounded now, so a bare ">=" can
  # never drag in an unreviewed 0.36 / 1.x.
  "sharp@^0.34.0": "^0.35.5"
  # GHSA-68fv-2mgg-jv7q (CVE-2026-93749, HIGH): event-loop denial of service
  # through indexed source-map section offsets. Fixed in 1.2.2, a patch on the
  # same line. Trivy's prod-scoped gate went red on 2026-10-06 (SD-38).
  "source-map-js@1": "^1.2.2"

# pnpm 11 makes an unadjudicated build script a hard error, so each is a
# decision. See backend/pnpm-workspace.yaml for the full rationale.
allowBuilds:
  esbuild: true            # fetches its platform binary
  "@swc/core": true        # resolves its native binary
  sharp: true              # image pipeline; needs its platform binary
  "@parcel/watcher": true  # native watcher used by the dev server
  unrs-resolver: true      # native resolver used by the linter
  core-js-pure: true       # postinstall only prints; harmless and quiet
  "@sentry/cli": false     # downloads a binary at install; unused in CI builds
