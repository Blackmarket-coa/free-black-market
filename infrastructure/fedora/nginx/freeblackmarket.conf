# nginx vhost for the FreeBlackMarket Fedora single-host deployment.
#
# Reverse-proxies four hostnames to the Docker Compose stack on 127.0.0.1.
# certbot's nginx plugin will inject TLS server blocks + the HTTP->HTTPS
# redirect when issue-certs.sh runs against this file.
#
# Hostnames here mirror infrastructure/k8s/production/30-ingress.yaml.

# --- Shared upstream definitions -----------------------------------------
upstream fbm_backend     { server 127.0.0.1:9000; keepalive 32; }
upstream fbm_storefront  { server 127.0.0.1:3000; keepalive 32; }
upstream fbm_admin       { server 127.0.0.1:7000; keepalive 32; }
upstream fbm_vendor      { server 127.0.0.1:7001; keepalive 32; }

# --- Common proxy config (DRY via include) -------------------------------
# nginx interprets this as a snippet at runtime; install.sh copies it
# alongside the vhost.

# --- Storefront ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name freeblackmarket.com www.freeblackmarket.com;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://fbm_storefront;
    }

    location = /healthz {
        proxy_pass http://fbm_storefront/api/health;
        access_log off;
    }
}

# --- API / Backend -------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.freeblackmarket.com;

    # Allow large uploads for product imagery via /admin endpoints.
    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://fbm_backend;
    }

    location = /health {
        proxy_pass http://fbm_backend/health;
        access_log off;
    }
}

# --- Admin Panel ---------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.freeblackmarket.com;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://fbm_admin;
    }

    location = /healthz {
        proxy_pass http://fbm_admin/healthz;
        access_log off;
    }
}

# --- Vendor Panel --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name vendor.freeblackmarket.com;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://fbm_vendor;
    }

    location = /healthz {
        proxy_pass http://fbm_vendor/healthz;
        access_log off;
    }
}
