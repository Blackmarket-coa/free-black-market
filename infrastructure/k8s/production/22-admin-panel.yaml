apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-panel
  namespace: freeblackmarket-production
  labels:
    app: admin-panel
    app.kubernetes.io/part-of: freeblackmarket
    app.kubernetes.io/component: panel
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: admin-panel
  template:
    metadata:
      labels:
        app: admin-panel
        app.kubernetes.io/part-of: freeblackmarket
        app.kubernetes.io/component: panel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: admin-panel
          image: __IMAGE_REGISTRY__/free-black-market-admin-panel:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - secretRef:
                name: admin-panel-env
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: admin-panel
  namespace: freeblackmarket-production
  labels:
    app: admin-panel
spec:
  type: ClusterIP
  selector:
    app: admin-panel
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
