# Dependency overrides.
#
# These live here rather than in package.json's `pnpm.overrides` because
# pnpm 11 stopped reading that field. Nearly every entry pins a CVE fix, so
# a silently-dropped override reintroduces the vulnerability while leaving
# every gate green — Trivy reads the lockfile, and the lockfile would just
# say the old version was always intended.
#
# Two things keep that from happening again:
#   - `scripts/check-override-coverage.mjs` asserts every override below
#     actually binds in the resolved lockfile.
#   - installs must NOT pass `--ignore-workspace`. That flag makes pnpm
#     ignore this file entirely, with no warning at all. This directory is
#     its own workspace root precisely so the flag is unnecessary.
overrides:
  "glob": ">=10.5.0"
  "qs": ">=6.14.2"
  "jws": ">=3.2.3"
  "axios": ">=1.18.0"
  "@isaacs/brace-expansion": ">=5.0.1"
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@5": "^5.0.9"
  # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870): quadratic CPU consumption resolving
  # !!omap. Both lines are patched — 3.15.1 and 4.3.1 — so this is a floor
  # bump on the existing pins, not a major migration.
  "js-yaml@3": "^3.15.1"
  "js-yaml@4": "^4.3.1"
  # CVE-2026-67213: infinite loop in nanoid's customAlphabet. Fixed in the
  # 3.x line at 3.3.17. Caret-bounded on purpose: a bare ">=3.3.17" lets pnpm
  # resolve to nanoid 6, which is ESM-only and breaks every CommonJS require.
  "nanoid@3": "^3.3.17"
  "@remix-run/router": ">=1.23.2"
  "fast-xml-parser": ">=5.3.6"
  "@medusajs/core-flows": "2.14.2"
  "@medusajs/orchestration": "2.14.2"
  "@medusajs/workflows-sdk": "2.14.2"
  "lodash": ">=4.18.0"
  "picomatch": ">=4.0.4"
  "postcss": ">=8.5.18"
  "@grpc/grpc-js": ">=1.14.4"
  "esbuild": ">=0.28.1"
  "form-data": ">=4.0.6"
  "vite": "^6.4.3"
  "@mikro-orm/core": "6.6.14"
  "@mikro-orm/cli": "6.6.14"
  "@mikro-orm/knex": "6.6.14"
  "@mikro-orm/migrations": "6.6.14"
  "@mikro-orm/postgresql": "6.6.14"
  "@opentelemetry/exporter-prometheus": ">=0.217.0"
  "@opentelemetry/sdk-node": ">=0.217.0"
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  "immutable": ">=5.1.8"
  "minimatch@3": "^3.1.3"
  "minimatch@10": "^10.2.1"
  "multer": ">=2.2.0"
  "nodemailer": ">=9.0.1"
  "path-to-regexp@0": "^0.1.13"
  "path-to-regexp@8": "^8.4.0"
  "protobufjs": ">=8.4.1"
  "rollup": ">=4.59.0"
  "zod": "4.2.0"

# Dependency build scripts, explicitly adjudicated.
#
# pnpm blocks postinstall scripts by default — a supply-chain control, since a
# build script is arbitrary code from a transitive dependency. pnpm 10 warned
# about unadjudicated ones; pnpm 11 makes them a hard error
# (ERR_PNPM_IGNORED_BUILDS, exit 1), so each of these has to be a decision
# rather than a default. pnpm scaffolds this block itself on a fresh install.
allowBuilds:
  # Needed: something is broken or noisy without them.
  "@swc/core": true       # jest's transform; resolves its native binary
  bcrypt: true            # password hashing — selects this platform's prebuild
  esbuild: true           # fetches its platform binary
  msgpackr-extract: true  # optional accelerator, but loud at boot when absent
  # Refused on purpose. Declared rather than omitted so the error above keeps
  # meaning "nobody has looked at this yet".
  "@medusajs/telemetry": false  # phone-home on install; nothing needs it to run
