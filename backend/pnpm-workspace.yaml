# Dependency overrides.
#
# These live here rather than in package.json's `pnpm.overrides` because
# pnpm 11 stopped reading that field. Nearly every entry pins a CVE fix, so
# a silently-dropped override reintroduces the vulnerability while leaving
# every gate green — Trivy reads the lockfile, and the lockfile would just
# say the old version was always intended.
#
# Two things keep that from happening again:
#   - `scripts/check-override-coverage.mjs` asserts every override below
#     actually binds in the resolved lockfile.
#   - installs must NOT pass `--ignore-workspace`. That flag makes pnpm
#     ignore this file entirely, with no warning at all. This directory is
#     its own workspace root precisely so the flag is unnecessary.
overrides:
  # GHSA-73wf-gq98-2v4g / GHSA-c83g-rgw3-j3cx: uncaught crash + prototype
  # write parsing untrusted browserslist-stats.json, and unbounded cache
  # growth to OOM. Both HIGH with a fix, so ignore-unfixed does not spare
  # them. Production here (not in the root or the panels, where
  # browserslist is dev-only and Trivy skips it).
  "browserslist": ">=4.28.7"
  # GHSA-82x6-q7mm-w9cf / GHSA-v5mp-jgw5-2x6j: prototype pollution and a
  # parser DoS in toml, reaching production through @stellar/stellar-sdk
  # (stellar.toml resolution). Fixed in 4.2.0. A major bump on a
  # transitive dep, so bounded rather than open-ended: 4.x stays
  # CommonJS, while 5.x is unverified against the SDK and a bare ">="
  # would drift there — the same trap documented for nanoid below.
  "toml@3": "^4.2.0"
  "glob": ">=10.5.0"
  "qs": ">=6.14.2"
  "jws": ">=3.2.3"
  # Seven HIGH advisories are fixed only in 1.20.0: GHSA-3pq3-5fj3-cg6v
  # (HTTP/2 adapter bypasses the configured DNS lookup and proxy control),
  # -542g-h47m-68v8 (DoS via an unhandled 'error' event on the HTTP/2
  # ClientHttp2Session), -c29m-xwm3-cm6r (ReDoS in the fromDataURI data: URL
  # parser, which freezes the Node event loop), -m8m8-qj5v-23w3 (prototype-
  # pollution gadget in the Node HTTP adapter), -mghh-pgcx-3jjj (O(N2) ReDoS
  # in shouldBypassProxy host normalisation), -r4gj-5m52-g5wh (maxRedirects: 0
  # not enforced by the fetch adapter) and -x97p-jq2g-jp4f (prototype-pollution
  # gadget in toFormData).
  #
  # The floor was a bare ">=1.18.0", which PERMITTED 1.20.0 and resolved to the
  # vulnerable 1.18.1 — a caret that allows the fix does not cause the fix.
  # Caret-bounded rather than left bare so a future axios 2.x cannot arrive
  # unreviewed.
  "axios": "^1.20.0"
  # GHSA-7h2j-956f-4vf2 (CVE-2026-25547, HIGH): uncontrolled resource
  # consumption, fixed only in 5.0.1. This is the renamed 5.x line, a separate
  # package from `brace-expansion` above, so it needs its own pin.
  "@isaacs/brace-expansion": "^5.0.1"
  # brace-expansion: five HIGH DoS advisories across the 1.x/2.x/5.x lines
  # (GHSA-3jxr-9vmj-r5cp, -6j4f-fj2g-mc7p, -mh99-v99m-4gvg, -qhr7-859c-m2p7,
  # -rgw5-rvv9-x895) plus the MODERATE -q2hr-2g5m-vwhr. The highest fix on each
  # line clears all six: 1.1.21, 2.1.7, 5.0.12.
  #
  # Each line is pinned separately because they are not interchangeable. 1.x and
  # 2.x still export the bare function (`module.exports = expandTop`), which
  # `minimatch@3.1.5` requires as `var expand = require('brace-expansion')`;
  # 5.x exports `{ expand }`. Forcing minimatch@3's consumers onto 5.x throws
  # `TypeError: expand is not a function` — that is what broke PR #754 and is
  # why SD-22 suppressed CVE-2026-14257 instead. The backports to 1.1.17/2.1.3
  # landed after SD-22 was written, so the suppression is no longer needed; the
  # export shape of 1.1.21 and 2.1.7 was re-verified before this bump.
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@5": "^5.0.12"
  # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870): quadratic CPU consumption resolving
  # !!omap. Both lines are patched — 3.15.1 and 4.3.1 — so this is a floor
  # bump on the existing pins, not a major migration.
  #
  # Raised again for CVE-2026-84375 (HIGH, DoS in YAML parsing), fixed at
  # 3.15.2 and 4.3.2. Both lines stay major-bounded: js-yaml 3→4 is an API
  # break (`safeLoad` removed), which is why the two pins exist separately.
  "js-yaml@3": "^3.15.2"
  "js-yaml@4": "^4.3.2"
  # CVE-2026-67213: infinite loop in nanoid's customAlphabet. Fixed in the
  # 3.x line at 3.3.17. Caret-bounded on purpose: a bare ">=3.3.17" lets pnpm
  # resolve to nanoid 6, which is ESM-only and breaks every CommonJS require.
  "nanoid@3": "^3.3.17"
  "@remix-run/router": ">=1.23.2"
  "fast-xml-parser": ">=5.3.6"
  "@medusajs/core-flows": "2.14.2"
  "@medusajs/orchestration": "2.14.2"
  "@medusajs/workflows-sdk": "2.14.2"
  "lodash": ">=4.18.0"
  "picomatch": ">=4.0.4"
  "postcss": ">=8.5.18"
  # CVE-2026-101916 (HIGH): authentication bypass via improper peer
  # certificate validation — a TLS peer can present a certificate grpc-js
  # accepts when it should not. Fixed in 1.13.6 and 1.14.5.
  #
  # The floor here was ">=1.14.4" and the tree resolved exactly 1.14.4: one
  # patch short of the fix, which the range already permitted. Same failure
  # as the axios entry above, and the reason both are caret-bounded now.
  "@grpc/grpc-js": "^1.14.5"
  "esbuild": ">=0.28.1"
  "form-data": ">=4.0.6"
  "vite": "^6.4.3"
  "@mikro-orm/core": "6.6.14"
  "@mikro-orm/cli": "6.6.14"
  "@mikro-orm/knex": "6.6.14"
  "@mikro-orm/migrations": "6.6.14"
  "@mikro-orm/postgresql": "6.6.14"
  "@opentelemetry/exporter-prometheus": ">=0.217.0"
  "@opentelemetry/sdk-node": ">=0.217.0"
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  "immutable": ">=5.1.8"
  "minimatch@3": "^3.1.3"
  "minimatch@10": "^10.2.1"
  # CVE-2026-77037, CVE-2026-77078, CVE-2026-82333 (all HIGH): three
  # denial-of-service paths — a file-descriptor leak on aborted uploads, a
  # crafted multipart field name, and an oversized array index in a field
  # name. multer parses untrusted multipart bodies on upload routes, so all
  # three are reachable. Fixed in 2.3.0. Caret-bounded, not ">=": an
  # open-ended floor lets pnpm drift onto the next major.
  "multer": "^2.3.0"
  # GHSA-2x7j-588g-ccc2 (HIGH): quadratic time in addressparser, so a crafted
  # address header is a remote DoS. Fixed in 9.1.0. Caret-bounded for the
  # reason above and because it was not theoretical here — ">=9.1.0" resolved
  # to nodemailer 10.0.1, an unreviewed major, on the first install.
  #
  # 2026-10-01: the 9.x line is now a dead end. Two more addressparser DoS
  # advisories landed — GHSA-prgh-xp8r-p3m5 (O(n^2) on comment-joined
  # addresses, fixed 10.0.5) and GHSA-v53p-9fqp-m79j (quadratic backtracking
  # in the free-text fallback, fixed 10.0.6) — and NEITHER has a 9.x
  # backport. Holding at ^9.1.0 is therefore no longer the conservative
  # choice; it is the vulnerable one, so the major this comment previously
  # refused is now the only fix.
  #
  # The 10.x major is reviewed rather than assumed: the whole FBM surface is
  # backend/src/modules/smtp/service.ts — `createTransport({host, port,
  # secure, auth})`, `transporter.verify()` and `sendMail()`, all unchanged
  # in 10.x. The sibling Blackout repo runs the same 9->10 bump in
  # production (its PR #938), which is the same call shape.
  "nodemailer": "^10.0.9"
  "path-to-regexp@0": "^0.1.13"
  "path-to-regexp@8": "^8.4.0"
  "protobufjs": ">=8.4.1"
  "rollup": ">=4.59.0"
  "zod": "4.2.0"

# Dependency build scripts, explicitly adjudicated.
#
# pnpm blocks postinstall scripts by default — a supply-chain control, since a
# build script is arbitrary code from a transitive dependency. pnpm 10 warned
# about unadjudicated ones; pnpm 11 makes them a hard error
# (ERR_PNPM_IGNORED_BUILDS, exit 1), so each of these has to be a decision
# rather than a default. pnpm scaffolds this block itself on a fresh install.
allowBuilds:
  # Needed: something is broken or noisy without them.
  "@swc/core": true       # jest's transform; resolves its native binary
  bcrypt: true            # password hashing — selects this platform's prebuild
  esbuild: true           # fetches its platform binary
  msgpackr-extract: true  # optional accelerator, but loud at boot when absent
  # Refused on purpose. Declared rather than omitted so the error above keeps
  # meaning "nobody has looked at this yet".
  "@medusajs/telemetry": false  # phone-home on install; nothing needs it to run
